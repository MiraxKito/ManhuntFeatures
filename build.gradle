plugins {
    id 'java'
}

group = 'ru.kitoro'
version = '1.0.2'

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}

// Each artifact is compiled against the oldest API in its supported range.
// The source intentionally uses only APIs shared by all profiles.
def variants = [
    mh161: [minecraft: '1.16.1', api: '1.16.1-R0.1-SNAPSHOT', release: 8,  apiVersion: null],
    mh171: [minecraft: '1.17.1', api: '1.17.1-R0.1-SNAPSHOT', release: 8,  apiVersion: '1.17'],
    mh182: [minecraft: '1.18.2', api: '1.18.2-R0.1-SNAPSHOT', release: 8,  apiVersion: '1.18'],
    mh194: [minecraft: '1.19.4', api: '1.19.4-R0.1-SNAPSHOT', release: 8,  apiVersion: '1.19'],
    mh201: [minecraft: '1.20.1', api: '1.20.1-R0.1-SNAPSHOT', release: 17, apiVersion: '1.20'],
    mh214: [minecraft: '1.21.4', api: '1.21.4-R0.1-SNAPSHOT', release: 21, apiVersion: '1.21']
]

variants.each { name, variant ->
    configurations.create("${name}CompileOnly")
    dependencies.add("${name}CompileOnly", "org.spigotmc:spigot-api:${variant.api}") {
        transitive = false
    }

    def suffix = name.capitalize()
    def classesDir = layout.buildDirectory.dir("classes/java/${name}")
    def resourcesDir = layout.buildDirectory.dir("resources/${name}")
    def artifactVersion = "${project.version}-${variant.minecraft}"

    tasks.register("compile${suffix}", JavaCompile) {
        source = fileTree('src/main/java')
        classpath = configurations.getByName("${name}CompileOnly")
        destinationDirectory = classesDir
        options.encoding = 'UTF-8'
        options.release = variant.release
    }

    tasks.register("process${suffix}Resources", Copy) {
        from 'src/main/resources/config.yml'
        from 'src/main/resources/messages-en.yml'
        from 'src/main/resources/messages-ru.yml'
        into resourcesDir
    }

    tasks.register("${name}Jar", Jar) {
        dependsOn tasks.named("compile${suffix}"), tasks.named("process${suffix}Resources")
        archiveBaseName = 'mhfeatures'
        archiveVersion = artifactVersion
        from classesDir
        from resourcesDir
        if (variant.apiVersion == null) {
            from('src/main/resources/plugin-legacy.yml') {
                rename { 'plugin.yml' }
                expand(version: artifactVersion)
            }
        } else {
            from('src/main/resources/plugin.yml') {
                rename { 'plugin.yml' }
                expand(version: artifactVersion, apiVersion: variant.apiVersion)
            }
        }
    }
}

tasks.register('compileMhLegacy') { dependsOn tasks.named('compileMh161') }
tasks.register('processMhLegacyResources') { dependsOn tasks.named('processMh161Resources') }
tasks.register('mhLegacyJar') { dependsOn tasks.named('mh161Jar') }
tasks.register('compileMhModern') { dependsOn tasks.named('compileMh201') }
tasks.register('processMhModernResources') { dependsOn tasks.named('processMh201Resources') }
tasks.register('mhModernJar') { dependsOn tasks.named('mh201Jar') }

tasks.register('allJars') {
    dependsOn variants.keySet().collect { tasks.named("${it}Jar") }
}
