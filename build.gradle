plugins {
    id 'java'
}

group = 'ru.kitoro'
version = '1.3.0'

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}

configurations {
    mhLegacyCompileOnly
    mhModernCompileOnly
}

dependencies {
    mhLegacyCompileOnly 'org.spigotmc:spigot-api:1.16.1-R0.1-SNAPSHOT'
    mhModernCompileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
}

tasks.register('compileMhLegacy', JavaCompile) {
    source = fileTree('src/main/java')
    classpath = configurations.mhLegacyCompileOnly
    destinationDirectory = layout.buildDirectory.dir('classes/java/mhLegacy').get().asFile
    options.encoding = 'UTF-8'
    options.release = 8
}

tasks.register('processMhLegacyResources', Copy) {
    from 'src/main/resources/config.yml'
    into layout.buildDirectory.dir('resources/mhLegacy')
}

tasks.register('mhLegacyJar', Jar) {
    dependsOn tasks.named('compileMhLegacy'), tasks.named('processMhLegacyResources')
    archiveBaseName = 'mhfeatures'
    archiveVersion = project.version + '-1.16.1'
    from layout.buildDirectory.dir('classes/java/mhLegacy')
    from layout.buildDirectory.dir('resources/mhLegacy')
    from('src/main/resources/plugin-legacy.yml') {
        rename { 'plugin.yml' }
        expand(version: project.version + '-1.16.1')
    }
}

tasks.register('compileMhModern', JavaCompile) {
    source = fileTree('src/main/java')
    classpath = configurations.mhModernCompileOnly
    destinationDirectory = layout.buildDirectory.dir('classes/java/mhModern').get().asFile
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.register('processMhModernResources', Copy) {
    from 'src/main/resources'
    into layout.buildDirectory.dir('resources/mhModern')
    exclude('plugin-legacy.yml')
    filesMatching('plugin.yml') {
        expand(version: project.version + '-1.20.1')
    }
}

tasks.register('mhModernJar', Jar) {
    dependsOn tasks.named('compileMhModern'), tasks.named('processMhModernResources')
    archiveBaseName = 'mhfeatures'
    archiveVersion = project.version + '-1.20.1'
    from layout.buildDirectory.dir('classes/java/mhModern')
    from layout.buildDirectory.dir('resources/mhModern')
}

tasks.register('allJars') {
    dependsOn tasks.named('mhLegacyJar'), tasks.named('mhModernJar')
}
